- comment: Class Diagram
  begin: ^\s*(classDiagram)
  beginCaptures:
    '1':
      name: keyword.control.mermaid
  patterns:
    - match: \%%.*
      name: comment
    - comment: 'note for (class) "note text" (single line)'
      match: !regex |-
        ^\s*(note)\s+(for)\s+
        (?:(`)([^`]+)(`)|([\w.-]+))
        \s+
        ("[^"]*")
        \s*$
      captures:
        '1':
          name: keyword.control.mermaid
        '2':
          name: keyword.control.mermaid
        '3':
          name: punctuation.definition.string.begin.mermaid
        '4':
          name: entity.name.type.class.mermaid
        '5':
          name: punctuation.definition.string.end.mermaid
        '6':
          name: entity.name.type.class.mermaid
        '7':
          name: string.quoted.double.mermaid
    - comment: namespace block
      begin: !regex ^\s*(namespace)\s+([\w.-]+)\s*(\{)
      beginCaptures:
        '1':
          name: keyword.control.mermaid
        '2':
          name: variable.other.namespace.mermaid
        '3':
          name: keyword.control.mermaid
      patterns:
        - match: \%%.*
          name: comment
        - comment: 'class (class name) ~?(generic type)?~? ({)'
          begin: !regex (class)\s+(?:(`)([^`]+)(`)|([\w.-]+)(~)?([\w.-]+)?(~)?)\s*(\{)
          beginCaptures:
            '1':
              name: keyword.control.mermaid
            '2':
              name: punctuation.definition.string.begin.mermaid
            '3':
              name: entity.name.type.class.mermaid
            '4':
              name: punctuation.definition.string.end.mermaid
            '5':
              name: entity.name.type.class.mermaid
            '6':
              name: punctuation.definition.typeparameters.begin.mermaid
            '7':
              name: storage.type.mermaid
            '8':
              name: punctuation.definition.typeparameters.end.mermaid
            '9':
              name: keyword.control.mermaid
          patterns:
            - match: \%%.*
              name: comment
            - comment: '(visibility)?(function)( (function param/generic param)? )(classifier)? (return/generic return)?$'
              begin: !regex |-
                \s([\+~#-])? # visibility
                ([\w.-]+) # function name
                (\() # (
              beginCaptures:
                '1':
                  name: keyword.control.mermaid
                '2':
                  name: entity.name.function.mermaid
                '3':
                  name: punctuation.parenthesis.open.mermaid
              patterns:
                - comment: (TBD)
                  match: !regex |-
                    \s*,?\s*([\w.-]+)? # function param
                    (~)? # ~
                    ([\w.-]+)? # generic function param
                    (~)? # ~
                    \s?([\w.-]+)? # function name
                  captures:
                    '1':
                      name: storage.type.mermaid
                    '2':
                      name: punctuation.definition.typeparameters.begin.mermaid
                    '3':
                      name: storage.type.mermaid
                    '4':
                      name: punctuation.definition.typeparameters.end.mermaid
                    '5':
                      name: entity.name.variable.parameter.mermaid
              end: !regex |-
                (\)) # )
                ([*\$]{0,2}) # classifier
                \s?([\w.-]+)? # return type
                (~)? # ~
                ([\w.-]+)? # generic return type
                (~)?$ # ~
              endCaptures:
                '1':
                  name: punctuation.parenthesis.closed.mermaid
                '2':
                  name: keyword.control.mermaid
                '3':
                  name: storage.type.mermaid
                '4':
                  name: punctuation.definition.typeparameters.begin.mermaid
                '5':
                  name: storage.type.mermaid
                '6':
                  name: punctuation.definition.typeparameters.end.mermaid
            - comment: 'map~a,b~ member line'
              match: !regex |-
                ^\s*(map)(~)([^,~]+)(,)([^~]+)(~)\s*$
              captures:
                '1':
                  name: keyword.control.map.mermaid
                '2':
                  name: punctuation.definition.generic.begin.mermaid
                '3':
                  name: support.type.primitive.mermaid
                '4':
                  name: punctuation.separator.comma.mermaid
                '5':
                  name: support.type.primitive.mermaid
                '6':
                  name: punctuation.definition.generic.end.mermaid
            - comment: 'Go-style field line'
              match: !regex |-
                \s([\+~#-])?\s*
                ((?:\[\]\*|\[\]|\*|\*?\*?)(?:[\w.]+(?:\.[\w.]+)*)(?:\[\])?)
                \s+
                ([\w.]+)
                \s*$
              captures:
                '1':
                  name: keyword.control.mermaid
                '2':
                  name: storage.type.mermaid
                '3':
                  name: entity.name.variable.field.mermaid
            - comment: '(visibility)?(datatype/generic data type) (attribute name)$'
              match: !regex |-
                \s([\+~#-])? # visibility
                ([\w.-]+) # datatype
                (~)? # ~
                ([\w.-]+)? # datatype
                (~)? # ~
                \s([\w.-]+)?$ # attribute name
              captures:
                '1':
                  name: keyword.control.mermaid
                '2':
                  name: storage.type.mermaid
                '3':
                  name: punctuation.definition.typeparameters.begin.mermaid
                '4':
                  name: storage.type.mermaid
                '5':
                  name: punctuation.definition.typeparameters.end.mermaid
                '6':
                  name: entity.name.variable.field.mermaid
            - comment: '<<(Annotation)>> (class name)'
              match: !regex |-
                (<<) # <<
                ([\w-]+) # annotation
                (>>) # >>
                \s?([\w.-]+)? # class name
              captures:
                '1':
                  name: punctuation.definition.stereotype.begin.mermaid
                '2':
                  name: entity.name.tag.stereotype.mermaid
                '3':
                  name: punctuation.definition.stereotype.end.mermaid
                '4':
                  name: entity.name.type.class.mermaid
          end: (})
          endCaptures:
            '1':
              name: keyword.control.mermaid
      end: !regex ^\s*(\})
      endCaptures:
        '1':
          name: keyword.control.mermaid
    - comment: '(class name) ("multiplicity relationship")? (relationship) ("multiplicity relationship")? (class name) :? (labelText)?'
      match: !regex |-
        (?:(`)([^`]+)(`)|([\w.-]+))
        \s*
        ("(?:\d+|\*|0..\d+|1..\d+|1..\*)")?
        \s*
        (--o|--\*|\<--|--\>|<\.\.|\.\.\>|\<\|\.\.|\.\.\|\>|\<\|--|--\|>|--\*|--|\.\.|\*--|o--)
        \s*
        ("(?:\d+|\*|0..\d+|1..\d+|1..\*)")?
        \s*
        (?:(`)([^`]+)(`)|([\w.-]+))
        \s*
        (:)?
        \s*
        (.*)$
      captures:
        '1':
          name: punctuation.definition.string.begin.mermaid
        '2':
          name: entity.name.type.class.mermaid
        '3':
          name: punctuation.definition.string.end.mermaid
        '4':
          name: entity.name.type.class.mermaid
        '5':
          name: keyword.control.mermaid
        '6':
          name: keyword.control.mermaid
        '7':
          name: keyword.control.mermaid
        '8':
          name: punctuation.definition.string.begin.mermaid
        '9':
          name: entity.name.type.class.mermaid
        '10':
          name: punctuation.definition.string.end.mermaid
        '11':
          name: entity.name.type.class.mermaid
        '12':
          name: keyword.control.mermaid
        '13':
          name: string
